<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>새봄약속 — 약속의 말씀 뽑기</title>
  <meta name="description" content="새봄교회 송구영신 약속의 말씀 뽑기">
  <meta name="theme-color" content="#154f98">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
  <link rel="preload" href="fonts/SeoulHangang-Medium.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/SeoulHangang-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="wrap">

    <!-- 1. 시작 -->
    <section id="start" class="screen">
      <div class="horizon" aria-hidden="true"><svg class="star center" viewBox="-50 -50 100 100" aria-hidden="true"><path d="M0-48C3-14 14-3 48 0 14 3 3 14 0 48-3 14-14 3-48 0-14-3-3-14 0-48Z" fill="currentColor"/></svg></div>
      <p class="eyebrow"><span data-year>2027</span></p>
      <h1><span id="title-line">약속의 말씀</span></h1>
      <p class="lead">새해에 주시는 말씀 한 구절을<br>기도하는 마음으로 받아 보세요</p>

      <form id="start-form" class="form" autocomplete="off">
        <input id="name" name="saebom-who" aria-label="이름" type="text" autocomplete="off" inputmode="text" maxlength="20" placeholder="예: 김새봄">
        <p id="name-hint" class="hint" hidden>이름을 먼저 적어 주세요.</p>
        <button id="start-btn" class="btn primary" type="submit">말씀 받기</button>
        <p id="loading" class="hint">말씀을 준비하고 있습니다…</p>
      </form>
      <img class="church-logo" src="images/saebom-logo.png" alt="새봄교회" width="585" height="197">
    </section>

    <!-- 2. 카드 뒤집기 -->
    <section id="draw" class="screen" hidden>
      <p class="who"><span id="draw-name"></span> 님</p>
      <h2>기도하는 마음으로<br>카드를 눌러 주세요</h2>

      <div id="flip" class="flip" role="button" tabindex="0" aria-label="카드를 눌러 말씀 확인">
        <div class="face back">
          <div class="back-inner">
            <div class="horizon" aria-hidden="true"><svg class="star center" viewBox="-50 -50 100 100" aria-hidden="true"><path d="M0-48C3-14 14-3 48 0 14 3 3 14 0 48-3 14-14 3-48 0-14-3-3-14 0-48Z" fill="currentColor"/></svg></div>
            <p class="back-year" data-year>2027</p>
            <p class="back-title">새봄약속</p>
            <p class="back-tap">눌러서 열기</p>
          </div>
        </div>
        <div class="face front">
          <p id="front-name" class="f-name"></p>
          <p id="front-text" class="f-text"></p>
          <p id="front-ref" class="f-ref"></p>
          <p id="front-bless" class="f-bless"></p>
        </div>
      </div>
    </section>

    <!-- 3. 결과 -->
    <section id="result" class="screen" hidden>
      <div class="horizon" aria-hidden="true"><svg class="star center" viewBox="-50 -50 100 100" aria-hidden="true"><path d="M0-48C3-14 14-3 48 0 14 3 3 14 0 48-3 14-14 3-48 0-14-3-3-14 0-48Z" fill="currentColor"/></svg></div>
      <p class="eyebrow"><span data-year>2027</span></p>
      <h1>약속의 말씀</h1>

      <!-- 시작 화면의 안내 문구·이름 칸 자리에 받은 약속의 말씀을 적습니다 -->
      <div class="promise">
        <p id="again-note" class="note" hidden>이미 받으신 말씀입니다.</p>
        <p id="result-name" class="p-name"></p>
        <p id="result-text" class="p-text"></p>
        <p id="result-ref" class="p-ref"></p>
        <p id="result-bless" class="p-bless"></p>
      </div>

      <div class="actions">
        <button id="save-btn" class="btn primary" type="button">그림으로 저장</button>
        <button id="share-btn" class="btn" type="button">카카오톡 등으로 보내기</button>
        <button id="other-btn" class="btn ghost" type="button">다른 사람 이름으로 뽑기</button>
      </div>
      <img class="church-logo" src="images/saebom-logo.png" alt="새봄교회" width="585" height="197">
    </section>

    <div id="toast" class="toast" role="status" hidden></div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/card.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
